# 单节点 KRaft 模式 Kafka（模拟环境）；生产应改为 3 节点 controller + broker 集群
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: bank-risk
spec:
  clusterIP: None
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
    - { name: controller, port: 9093, targetPort: 9093 }

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bank-risk
spec:
  type: ClusterIP
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: bank-risk
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.bank-risk.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless.bank-risk.svc.cluster.local:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          readinessProbe:
            exec:
              command: ["sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "3Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 10Gi }

---
# 一次性任务：预创建 Topic（幂等）
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: bank-risk
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: apache/kafka:3.8.0
          command:
            - /bin/bash
            - -c
            - |
              set -e
              B=kafka.bank-risk.svc.cluster.local:9092
              for spec in "bank-cdc-events:6" "bank-cdc-dlq:3"; do
                T=${spec%%:*}; P=${spec##*:}
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$B" --list | grep -qx "$T" \
                  || /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$B" --create \
                       --topic "$T" --partitions "$P" --replication-factor 1
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$B" --list
