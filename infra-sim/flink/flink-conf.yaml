# k3s 部署时作为 ConfigMap 挂载到 /opt/flink/conf/flink-conf.yaml
# 本地 docker-compose 通过 FLINK_PROPERTIES 环境变量注入同样的配置。

jobmanager.rpc.address: flink-jobmanager
jobmanager.bind-host: 0.0.0.0
taskmanager.bind-host: 0.0.0.0
taskmanager.host: flink-taskmanager

parallelism.default: 2
taskmanager.numberOfTaskSlots: 4
taskmanager.memory.process.size: 2048m
jobmanager.memory.process.size: 1024m

# Checkpoint：CDC 全量/增量切换与 Kafka 位点都依赖它
execution.checkpointing.interval: 30s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.min-pause: 10s
execution.checkpointing.timeout: 5min
execution.checkpointing.max-concurrent-checkpoints: 1
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

state.backend: hashmap
state.checkpoints.dir: file:///data/flink/checkpoints
state.savepoints.dir: file:///data/flink/savepoints

# Web UI
rest.address: 0.0.0.0
rest.bind-address: 0.0.0.0

# 作业异常时不要静默重启掩盖问题
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 3
restart-strategy.fixed-delay.delay: 10s
